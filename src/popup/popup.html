<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Umbreon</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="row">
      <div>
        <div class="title">Umbreon</div>
        <div class="subtitle" id="siteLabel">—</div>
      </div>
      <button id="openOptions" class="link" type="button">Settings</button>
    </header>

    <main>
      <div class="card">
        <div class="row">
          <div>
            <div class="label">Dark mode</div>
            <div class="hint" id="statusHint">—</div>
          </div>
          <button id="toggleBtn" class="btn" type="button">Toggle</button>
        </div>

        <div class="sep"></div>

        <button id="autoEnableSite" class="btn" type="button" style="width: 100%">
          Always enable on this site
        </button>
        <p class="hint" id="autoEnableHint"></p>

        <div class="sep"></div>

        <div class="label">Theme</div>
        <div class="theme-picker" id="themePicker">
          <button class="theme-swatch" data-theme="classic" title="Classic" style="background-color: #0f1115;"></button>
          <button class="theme-swatch" data-theme="amoled" title="AMOLED" style="background-color: #000;"></button>
          <button class="theme-swatch" data-theme="dim" title="Dim" style="background-color: #0b1220;"></button>
          <button class="theme-swatch" data-theme="sepia" title="Sepia" style="background-color: #14110d;"></button>
          <button class="theme-swatch" data-theme="nord" title="Nord" style="background-color: #2e3440;"></button>
          <button class="theme-swatch" data-theme="dracula" title="Dracula" style="background-color: #282a36;"></button>
          <button class="theme-swatch" data-theme="solarized" title="Solarized" style="background-color: #002b36;"></button>
          <button class="theme-swatch" data-theme="monokai" title="Monokai" style="background-color: #272822;"></button>
        </div>

        <div class="hint" id="permHint"></div>
      </div>

      <div class="footer">Creator: Nathan Kasco</div>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
